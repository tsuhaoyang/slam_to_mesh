<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>slam_to_mesh — viewer</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <header>
    <h1>slam_to_mesh — multi-view</h1>
    <p class="sub">Pick representations to display; each opens its own synced
      viewer. Meshes decimate by re-remesh (quad) or QEM (triangle); point clouds
      downsample by voxel. All independent.</p>
  </header>

  <div id="app">
    <div id="panes"></div>

    <aside id="panel">
      <div class="row">
        <label for="job">Job ID</label>
        <input id="job" type="text" placeholder="paste job_id" />
        <button id="load">Load</button>
      </div>

      <div class="row">
        <label class="section">Show</label>
        <label><input type="checkbox" class="show" value="triangle" /> Triangle mesh</label>
        <label><input type="checkbox" class="show" value="triangle_dec" /> Triangle — decimated</label>
        <label><input type="checkbox" class="show" value="quad" checked /> Quad mesh</label>
        <label><input type="checkbox" class="show" value="quad_dec" /> Quad — decimated</label>
        <label><input type="checkbox" class="show" value="pointcloud" /> Point cloud</label>
        <label><input type="checkbox" class="show" value="pointcloud_ds" /> Point cloud — downsample</label>
        <p id="gateNote" class="note"></p>
      </div>

      <div class="row slider-group" id="grpTri" hidden>
        <label>Triangle target: <span id="triPct">30%</span>
          (<span id="triFaces">—</span>)</label>
        <input id="triSlider" type="range" min="1" max="100" value="30" />
      </div>

      <div class="row slider-group" id="grpQuad" hidden>
        <label>Quad target: <span id="quadPct">30%</span>
          (<span id="quadFaces">—</span>)</label>
        <input id="quadSlider" type="range" min="1" max="100" value="30" />
      </div>

      <div class="row slider-group" id="grpPts" hidden>
        <label>Point target: <span id="ptsPct">30%</span>
          (<span id="ptsCount">—</span>)</label>
        <input id="ptsSlider" type="range" min="1" max="100" value="30" />
      </div>

      <div class="row">
        <button id="apply">Apply</button>
        <span id="status"></span>
      </div>
    </aside>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
